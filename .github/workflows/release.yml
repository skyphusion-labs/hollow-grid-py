name: release

# Image build + GHCR push for hollow-grid-py (Verdigris Spool). Mirrors hollow-grid-go:
#   - unittest + mypy on every push/PR
#   - docker build on every push/PR
#   - smoke conformance after build (blocking; same suite as ci.yml)
#   - push to GHCR (:<sha> + :latest) on a pushed version tag (v*) only
#
# There is no deploy step after the GHCR push: the Hetzner fleet was decommissioned
# 2026-09-24, so this workflow's only release output is the GHCR image.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/skyphusion-labs/hollow-grid-py

jobs:
  build:
    name: Lint, test, build, and push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e '.[dev]'

      - name: Test
        run: python -m unittest discover -s hollow_grid/tests -v

      - name: Typecheck
        run: python -m mypy

      - name: Build image
        run: docker build -t "$IMAGE:${GITHUB_SHA}" -t "$IMAGE:latest" .

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Smoke conformance
        run: |
          set -euo pipefail
          SMOKE_DIR=$(mktemp -d)
          git clone --depth 1 https://github.com/skyphusion-labs/the-hollow-grid.git "$SMOKE_DIR"
          test -f "$SMOKE_DIR/smoke.mjs"
          ADMIN_TOKEN="$(openssl rand -hex 16)"
          docker rm -f hgp-ci >/dev/null 2>&1 || true
          docker run -d --name hgp-ci -p 18791:8791 -e ADMIN_TOKEN="$ADMIN_TOKEN" "$IMAGE:latest"
          up=0
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:18791/health >/dev/null; then
              up=1
              break
            fi
            sleep 1
          done
          test "$up" = 1
          set +e
          ADMIN_TOKEN="$ADMIN_TOKEN" MUD_URL=ws://127.0.0.1:18791/ws SMOKE_SLOW=2 timeout 900 node "$SMOKE_DIR/smoke.mjs" > smoke.txt 2>&1
          code=$?
          set -e
          docker rm -f hgp-ci >/dev/null 2>&1 || true
          pass=$(grep -c '^ok' smoke.txt || true)
          fail=$(grep -c '^FAIL' smoke.txt || true)
          skip=$(grep -c '^SKIP' smoke.txt || true)
          echo "smoke conformance: ${pass} ok / ${fail} fail / ${skip} skip"
          exit "$code"

      - name: Upload smoke results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-results
          path: smoke.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Assert tag is on main (no prod publish from an unmerged branch)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME points at $GITHUB_SHA which is not on origin/main; refusing to publish an unreviewed commit"
            exit 1
          fi

      - name: Log in to GHCR (tag only)
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push to GHCR (tag only)
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        run: |
          docker push "$IMAGE:${GITHUB_SHA}"
          docker push "$IMAGE:latest"
          echo "Pushed hollow-grid-py:${GITHUB_SHA}."

      - name: Clean up
        if: always()
        run: |
          docker rm -f hgp-ci >/dev/null 2>&1 || true
          docker logout ghcr.io || true
