# Verdigris Spool on the Hollow Grid (Python port). Pull the GHCR image after merge to
# main, or build locally: docker compose build
#
# Federation: set GRID_HUB_URL + GRID_HUB_TOKEN in .env (see .env.example).
# Standalone works with those unset (LocalHub fallback).
#
# There is no fleet host. The port mapping publishes the world on the host loopback
# only (127.0.0.1). Changing it to "8791:8791" exposes it on all host interfaces.
# Set GRID_HUB_URL if you want to join the live hub.

services:
  verdigris-spool:
    image: ghcr.io/skyphusion-labs/hollow-grid-py:latest
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8791:8791"
    volumes:
      - verdigris-data:/data
    env_file:
      - path: .env
        required: false
    environment:
      LISTEN_HOST: 0.0.0.0
      LISTEN_PORT: "8791"
      DATA_DIR: /data
      WORLD_NAME: Verdigris Spool
      # Leave WORLD_URL unset to skip hub registration.
      # WORLD_URL: ws://127.0.0.1:8791/ws
      # GRID_HUB_URL: https://grid-hub.skyphusion.org/rpc
      # GRID_HUB_TOKEN: set in .env (never commit)

volumes:
  verdigris-data:
